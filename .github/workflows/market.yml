# Weekly market snapshot — runs every Monday 11:00 UTC (7 AM Eastern), or by hand from the Actions tab.
# Writes market.json at the site root and commits it; Vercel redeploys on the push.
name: Update market data
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market.json
        run: python3 scripts/update_market.py
        env:
          MARKET_OUT: market.json
      - name: Commit if changed
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"  # owner identity so Vercel (Hobby) deploys the commit
          git add market.json
          git diff --cached --quiet && echo "no change" || git commit -m "market: weekly snapshot $(date -u +%F)" && git push

# Sync Marketora — brings what Eduardo publishes in Marketora (listings, shared sales, blog posts) onto
# eduardoinoa.com as static pages. Every 3 hours, or by hand from the Actions tab.
# Commits only when the content changed; Vercel redeploys on the push.
name: Sync Marketora
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-regenerate
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull the Marketora feed
        run: node scripts/sync-marketora.mjs
      - name: Regenerate and check (only when the snapshot changed)
        run: |
          if git diff --quiet -- tools/data/marketora.json && git ls-files --error-unmatch tools/data/marketora.json >/dev/null 2>&1; then echo "no change"; exit 0; fi
          [ -f tools/data/marketora.json ] || { echo "no snapshot"; exit 0; }
          cd tools && npm ci && node generate.mjs && node qa.mjs
      - name: Commit if changed
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"  # owner identity so Vercel (Hobby) deploys the commit
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "marketora: sync $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
